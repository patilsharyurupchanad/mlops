name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-test-train:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Lint code
      run: flake8 api tests

    - name: Run unit tests
      run: pytest -v

    - name: Train model
      run: python train.py

    - name: Upload trained model artifact
      uses: actions/upload-artifact@v3
      with:
        name: trained-model
        path: models/champion_model.pkl
