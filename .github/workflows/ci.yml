name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-test-train:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: pip install -r 2025ae05445/Heart_Disease_Detection/requirements.txt

    - name: Lint code
      run: flake8 2025ae05445/Heart_Disease_Detection/api 2025ae05445/Heart_Disease_Detection/tests

    - name: Run unit tests
      run: pytest 2025ae05445/Heart_Disease_Detection/tests -v

    - name: Train model
      run: python 2025ae05445/Heart_Disease_Detection/train.py

    - name: Upload trained model artifact
      uses: actions/upload-artifact@v4
      with:
        name: trained-model
        path: 2025ae05445/Heart_Disease_Detection/models/champion_model.pkl
